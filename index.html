<body>

<div id="app"></div>

<div class="splash-screen" id="splash-screen">
    <canvas class="splash-canvas" id="splash-canvas" aria-hidden="true"></canvas>
    <div class="splash-glow splash-glow--a" aria-hidden="true"></div>
    <div class="splash-glow splash-glow--b" aria-hidden="true"></div>
    <div class="splash-content">
      <div class="splash-logo">
        <div class="splash-ring"></div>
        <div class="splash-ring splash-ring--2"></div>
        <div class="seal seal--splash"><img class="seal__img" src="assets/logo.png" alt="JSS Manager logo" /></div>
      </div>
      <h2 class="splash-title">JSS Manager</h2>
      <div class="splash-subtitle">Loading<span class="splash-dots"><span>.</span><span>.</span><span>.</span></span></div>
      <div class="splash-loader">
        <div class="splash-loader-bar"></div>
      </div>
    </div>
</div>

<script>
(function () {
  // Lightweight canvas particle field for the splash screen only.
  // Self-contained, no deps, and stops itself the instant the router
  // wipes #app (innerHTML = "") so it never runs against a detached node.
  var mq = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
  if (mq && mq.matches) return; // respect reduced-motion: keep the CSS-only splash

  var canvas = document.getElementById("splash-canvas");
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w, h, particles = [];
  var GOLD = "201,162,39";
  var BLUE = "30,111,181";

  function size() {
    w = canvas.width = Math.floor(innerWidth * dpr);
    h = canvas.height = Math.floor(innerHeight * dpr);
    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";
  }

  function makeParticles() {
    var count = Math.min(70, Math.floor((innerWidth * innerHeight) / 18000));
    particles = [];
    for (var i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: (Math.random() * 1.6 + 0.6) * dpr,
        vy: (Math.random() * 0.35 + 0.12) * dpr,
        vx: (Math.random() - 0.5) * 0.15 * dpr,
        a: Math.random() * 0.5 + 0.15,
        c: Math.random() > 0.72 ? GOLD : BLUE
      });
    }
  }

  size();
  makeParticles();
  window.addEventListener("resize", function () { size(); makeParticles(); });

  var raf;
  function frame() {
    if (!document.body.contains(canvas)) { cancelAnimationFrame(raf); return; }
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.y -= p.vy;
      p.x += p.vx;
      if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(" + p.c + "," + p.a + ")";
      ctx.fill();
    }
    // faint connecting lines between nearby particles for a "network" feel
    var maxDist = 90 * dpr;
    for (var a = 0; a < particles.length; a++) {
      for (var b = a + 1; b < particles.length; b++) {
        var dx = particles[a].x - particles[b].x, dy = particles[a].y - particles[b].y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < maxDist) {
          ctx.strokeStyle = "rgba(" + GOLD + "," + (0.08 * (1 - d / maxDist)) + ")";
          ctx.lineWidth = dpr;
          ctx.beginPath();
          ctx.moveTo(particles[a].x, particles[a].y);
          ctx.lineTo(particles[b].x, particles[b].y);
          ctx.stroke();
        }
      }
    }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
})();
</script>

<div id="toast-root"></div>

<noscript>
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif;text-align:center;padding:32px;background:#FAF6F0;color:#21262B;">
    <div>
      <h2 style="color:#0B2545;margin-bottom:8px;">JSS Manager needs JavaScript</h2>
      <p style="color:#5C6A73;">Please enable JavaScript in your browser to use this system. Your data is safe and nothing has been changed.</p>
    </div>
  </div>
</noscript>

<!-- ==========================================================================
     Boot watchdog. Deliberately plain, inline, and independent of every
     other file: if a script/stylesheet fails to load, or the app JS never
     finishes starting up (blocked CDN, offline on first visit, a broken
     deploy...), this still shows something readable instead of leaving the
     splash screen spinning forever or a blank white tab. js/app.js pings
     __jssBootPing() as soon as it starts running and __jssBootOk() once the
     first route has rendered, both of which cancel this fallback.
     ========================================================================== -->
<script>
(function () {
  var settled = false;
  function settle() { settled = true; }
  window.__jssBootPing = settle;
  window.__jssBootOk = settle;

  var timer = setTimeout(function () {
    if (settled) return;
    showBootFallback("This is taking longer than expected to load.");
  }, 15000);

  window.addEventListener("error", function (e) {
    var t = e.target;
    if (settled || !t || t === window) return;
    if (t.tagName === "SCRIPT" || t.tagName === "LINK") {
      clearTimeout(timer);
      showBootFallback("A required file failed to load. This is usually a connection issue.");
    }
  }, true);

  function showBootFallback(reason) {
    if (settled) return;
    window.__jssHideSplash && window.__jssHideSplash();
    var app = document.getElementById("app");
    if (!app) return;
    app.innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;font-family:Arial,Helvetica,sans-serif;background:#FAF6F0;">' +
        '<div style="max-width:420px;width:100%;background:#FFFFFF;border:1px solid #DCE3E8;border-radius:8px;box-shadow:0 12px 32px rgba(11,37,69,0.16);padding:40px 32px;text-align:center;">' +
          '<div style="width:64px;height:64px;margin:0 auto 16px;border-radius:50%;background:#E4EDF7;display:flex;align-items:center;justify-content:center;font-size:30px;">&#9888;&#65039;</div>' +
          '<h2 style="color:#0B2545;margin:0 0 8px;font-family:Georgia,serif;">JSS Manager couldn\'t start</h2>' +
          '<p style="color:#5C6A73;margin:0 0 12px;line-height:1.5;">' + reason + ' Your data is safe and nothing has been lost or changed.</p>' +
          '<button onclick="location.reload()" style="background:#14538A;color:#fff;border:none;border-radius:6px;padding:10px 20px;font-size:14px;cursor:pointer;">Reload page</button>' +
          '<p style="color:#5C6A73;font-size:12px;margin-top:16px;">If this keeps happening, check your internet connection or contact your school administrator.</p>' +
        '</div>' +
      '</div>';
  }
})();
</script>

<script>
(function () {
  var MIN_SPLASH_MS = 3000; 
  var shownAt = Date.now();
  var hidden = false;

  function hideSplash() {
    if (hidden) return;
    hidden = true;
    var el = document.getElementById("splash-screen");
    if (!el) return;
    el.classList.add("splash-screen--hide");
    setTimeout(function () { el.remove(); }, 400);
  }

  window.__jssHideSplash = hideSplash; 

  var origBootOk = window.__jssBootOk;
  window.__jssBootOk = function () {
    if (origBootOk) origBootOk();
    var wait = Math.max(0, MIN_SPLASH_MS - (Date.now() - shownAt));
    setTimeout(hideSplash, wait);
  };
})();
</script>
