[build]
  publish = "."

# ==========================================================================
# Security edge function (maintenance mode + CSP nonce injection).
# Its path ("/*") is declared inline in netlify/edge-functions/security.ts
# via `export const config`, which is enough to wire it up — no
# [[edge_functions]] block needed here too. It runs on every request,
# after the static headers below have been applied, and rewrites the
# Content-Security-Policy header's script-src to use a fresh per-request
# nonce (see that file for details and how to toggle maintenance mode).
# ==========================================================================

# ==========================================================================
# Security headers
# Applies to every response. CSP is the main event; the rest are
# defense-in-depth headers that cost nothing and close off whole classes
# of attack (clickjacking, MIME sniffing, referrer leakage, etc).
#
# IMPORTANT: script-src below has no hashes or 'unsafe-inline' on
# purpose. netlify/edge-functions/security.ts rewrites this directive on
# every response, replacing it with a fresh 'nonce-...' value and
# stamping the matching nonce onto every <script> tag in the HTML. That
# means inline <script> content (splash particles, boot watchdog,
# splash-hide timing, the landing-page header/nav/reveal/counters/FAQ/
# form bootstrap script, etc.) can change freely with no build step and
# no per-script hash to keep in sync. The value here is just a
# same-origin fallback in the unlikely event the edge function doesn't
# run — it intentionally has no inline-script allowance of its own, so
# that fallback fails closed rather than silently permitting arbitrary
# inline scripts.
#
# style-src includes 'unsafe-inline' because the app's el() DOM helper
# (js/utils.js) renders dynamic styling as inline style="..." attributes
# at ~150 call sites across the views. Hashing/nonce-ing isn't practical
# here since many of those strings are built at runtime (per-row colors,
# computed widths, etc). This only relaxes CSS injection risk, not script
# execution — script-src stays locked to 'self' + explicit domains +
# the per-request nonce.
# ==========================================================================
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = '''
      default-src 'self';
      script-src 'self' https://www.gstatic.com https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob: https://res.cloudinary.com;
      connect-src 'self' https://api.cloudinary.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com;
      worker-src 'self' blob:;
      manifest-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-src 'none';
      frame-ancestors 'none';
      upgrade-insecure-requests;
    '''
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=(), clipboard-write=(self), fullscreen=(self)"
    X-XSS-Protection = "0"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# HTML must always be revalidated so deploys (and the maintenance page)
# show up immediately instead of being served stale from a browser/CDN cache.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/views/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"