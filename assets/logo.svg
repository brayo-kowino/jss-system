<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Self-contained seal -->
  <circle cx="32" cy="32" r="31" fill="#0B2545"/>
  <circle cx="32" cy="32" r="31"
          fill="none"
          stroke="#E9D9A0"
          stroke-width="1.25"
          opacity="0.6"/>

  <!-- Original subject, scaled up around its center -->
  <g transform="translate(32 32) scale(1.38) translate(-32 -32)">

    <!-- Open book -->
    <path d="M32,34 L17,38 L17,47 L32,43 Z"
          fill="#E9D9A0"/>
    <path d="M32,34 L47,38 L47,47 L32,43 Z"
          fill="#E9D9A0"/>
    <rect x="31" y="34" width="2" height="9"
          fill="#0B2545"/>

    <!-- Mortarboard -->
    <rect x="26" y="24" width="12" height="7"
          rx="3.5"
          fill="#E9D9A0"/>

    <polygon points="32,13 47,20 32,27 17,20"
             fill="#C9A227"/>

    <circle cx="32" cy="20" r="2"
            fill="#FAF6F0"/>

    <!-- Tassel -->
    <path d="M40,22.5
             C45,25 47,29.5 45,34"
          fill="none"
          stroke="#C9A227"
          stroke-width="1.6"
          stroke-linecap="round"/>

    <circle cx="45" cy="34" r="1.8"
            fill="#C9A227"/>

  </g>
</svg>